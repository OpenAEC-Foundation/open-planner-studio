<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Planner Studio</title>
    <script>
      // Anti-thema-flits (issue #61): zet het opgeslagen thema op <html> vóór de eerste paint.
      // Zonder dit valt de eerste paint op de :root-default (dark) en klapt de app pas ná de
      // React-mount (App.tsx → data-theme-effect) naar het gekozen thema — een zichtbare flits bij
      // Light. Dit script is bewust een minimale spiegel van `initTheme()`
      // (src/utils/settingsStore.ts): dezelfde sleutel (`ops-theme`), dezelfde 7→3-legacy-mapping,
      // dezelfde default 'dark'. `initTheme()` blijft de bron van waarheid en persisteert de
      // migratie daarna alsnog; App.tsx zet het attribuut opnieuw (idempotent).
      // De 'system'-voorkeur wordt hier net zo opgelost als in `resolveUITheme`
      // (src/utils/theme.ts): prefers-color-scheme → 'dark' of 'light'. Zonder dat zou juist de
      // systeemvolger de flits terugkrijgen die dit script wegneemt.
      (function () {
        var theme = 'dark';
        try {
          var map = {
            'default': 'dark', 'light': 'light', 'dark': 'dark', 'blue': 'dark',
            'amber-navy': 'dark', 'warm-ember': 'dark',
            'highContrast': 'high-contrast', 'high-contrast': 'high-contrast',
            'system': 'system',
          };
          var saved = localStorage.getItem('ops-theme');
          if (saved && Object.prototype.hasOwnProperty.call(map, saved)) theme = map[saved];
          if (theme === 'system') {
            var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = dark ? 'dark' : 'light';
          }
        } catch (_e) { /* localStorage geblokkeerd ⇒ default dark, net als initTheme() */ }
        // Alleen bereikbaar als matchMedia ontbreekt of gooit; 'light' spiegelt exact wat
        // `resolveUITheme('system', false)` in TS doet, zodat er ook dán geen flits ontstaat.
        if (theme === 'system') theme = 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body class="bg-surface text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
