openapi: 3.1.0
info:
  title: Open Planner Studio headless API
  version: 2026.48.0
  summary: Calculate an IFC construction schedule the same way the Open Planner Studio app does.
  description: |
    The API wraps the headless core `@openaec/open-planner-core`. Send an IFC file (IFC 4.3 or IFC4,
    ISO-10303-21 text); the API opens it, calculates it like F5 in the app (critical path method with
    the work rules and scheduling profile of the project) and returns a JSON summary or the
    recalculated IFC file. The API stores nothing: every request stands alone.

    Every request is first handled by the text route: the body is decoded as UTF-8, opened,
    calculated and written. Only where that route refuses because of foreign content, and the
    request was `application/octet-stream`, does the API read the same bytes again as they are; if
    that route cannot help either, the answer stays the one of the text route:

    - When reading: a file with a building model (422 `IFC_READ_FAILED`). If the bytes route keeps
      the model, the summary and, with `output=ifc`, the preserved file come from that one reading.
      No other read error opens the bytes route.
    - When writing: `output=ifc` refused with 500 `IFC_WRITE_FAILED` and `details.reason`
      `foreign`. If the bytes route keeps the foreign content and reads the same schedule (the same
      summary after the calculation, and the same stored planning: tasks, relations, calendars,
      resources, assignments and project fields), the preserved file comes back. Otherwise the
      answer stays the refusal of the text route, with the same status, code and `details`. The
      bytes route reads a file with foreign content by the rules of the app for such files, and
      that can give a different schedule than the text route; then the refusal stays.

    The answer of the text route is the outcome unless the bytes route succeeds: any other
    outcome (an error, a different schedule, the calculation time running out, a stopped or
    crashed worker) gives that refusal byte for byte. Such a request can therefore take up to the
    calculation time limit before the refusal arrives.

    A preserved file comes back as `application/octet-stream`, with the foreign content and the
    header (also a UTF-8 byte order mark) byte for byte as they were; without changes to the
    schedule the whole file comes back.

    Every path that is not listed answers 404 `NOT_FOUND`.

    Errors always have the body `{"error": {"code": "...", "message": "..."}}`. `code` is fixed;
    `message` is English text for people. Every response has an `X-Request-Id` header. Send your own
    `X-Request-Id` (1–64 characters `A-Z a-z 0-9 . _ -`) to correlate with the server logs.

    Documentation (Dutch): docs/headless-api.md in the repository.
  license:
    name: LGPL-3.0-or-later
    identifier: LGPL-3.0-or-later
  contact:
    name: OpenAEC Foundation
    url: https://github.com/OpenAEC-Foundation/open-planner-studio
servers:
  - url: http://127.0.0.1:8080
    description: Local server or container
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health and version
      description: No authentication. The load balancer health check uses this path.
      security: []
      responses:
        '200':
          description: The server runs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/schedule:
    post:
      operationId: scheduleIfc
      summary: Calculate an IFC schedule
      description: |
        There is no queue. One calculation runs at a time. When a calculation runs, or when
        `limits.maxUploads` request bodies are being received already, the API answers 503 `BUSY` at
        once, before it reads the body. Retry after `Retry-After` seconds.

        Time limits: the body must arrive within `limits.uploadTimeoutMs` (408 `UPLOAD_TIMEOUT`), and
        the calculation must finish within `limits.timeoutMs` (503 `TIMEOUT`; when the text route has
        already refused the file, that refusal instead). Together they stay below
        the 120 s idle timeout of the load balancer, so the API itself always answers.
      parameters:
        - name: output
          in: query
          required: false
          description: '`summary` (default) gives the JSON summary; `ifc` gives the recalculated IFC file as text (`application/x-step`), or as bytes (`application/octet-stream`) only where the text route refused the file because of foreign content and the request was `application/octet-stream` (see the description above).'
          schema:
            type: string
            enum: [summary, ifc]
            default: summary
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
      requestBody:
        required: true
        description: The IFC file, as text (UTF-8) or as bytes (`application/octet-stream`, which can keep a building model and the data of other programs where the text route refuses them). Maximum size is `limits.maxBodyBytes` from `/healthz` (default 20 MiB).
        content:
          application/x-step:
            schema:
              type: string
          application/ifc:
            schema:
              type: string
          model/ifc:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The file as bytes. The API decodes it as UTF-8 like the other types; only where the text route refuses the file because of foreign content does it read the bytes themselves.
      responses:
        '200':
          description: The schedule is calculated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSummary'
            application/x-step:
              schema:
                type: string
                description: The recalculated IFC file as text (when `output=ifc`).
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: |
                  The recalculated IFC file as bytes (when `output=ifc`, the request was
                  `application/octet-stream`, the text route refused the file because of a building model
                  or refused to write it with `foreign`, and the bytes route keeps the foreign content; in
                  the second case only when it reads the same schedule). The foreign content and the
                  header come back byte for byte; without changes to the schedule the whole file does.
        '400':
          description: '`INVALID_INPUT` (the body, as text or as bytes, does not start with `ISO-10303-21;` after an optional byte order mark and white space) or `BAD_REQUEST` (unknown `output`, or a request target that is not a valid URL).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`UNAUTHORIZED`: the bearer token is missing or wrong.'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          description: '`UPLOAD_TIMEOUT`: the body did not arrive within `limits.uploadTimeoutMs`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`PAYLOAD_TOO_LARGE`: the body is larger than the limit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: send one of the request content types.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The file is IFC but cannot be planned: `IFC_READ_FAILED`, `NO_TASKS`, or `SCHEDULE_FAILED`
            (for example a loop in the relations; `details.taskIds` lists the tasks of the loop). A file
            with a building model gives `IFC_READ_FAILED` on the text route; send it as
            `application/octet-stream` to open it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            `IFC_WRITE_FAILED` or `INTERNAL`. With `IFC_WRITE_FAILED`, `details.reason` says why when it
            is known: `foreign` (the file has foreign content that the text route does not
            keep), `model` or `unreadable` (other scan results).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`BUSY` (a calculation runs or too many uploads; decided before the body is read) or `TIMEOUT` (calculation stopped). Try again after `Retry-After` seconds.'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'The token from `OPS_API_TOKEN` or `OPS_API_TOKEN_FILE` on the server (on AWS from Secrets Manager).'
  headers:
    RequestId:
      description: The request id from the request header, or a new UUID.
      schema:
        type: string
  responses:
    MethodNotAllowed:
      description: '`METHOD_NOT_ALLOWED`. The `Allow` header lists the allowed methods.'
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_INPUT
                - BAD_REQUEST
                - UNAUTHORIZED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - UPLOAD_TIMEOUT
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - IFC_READ_FAILED
                - NO_TASKS
                - SCHEDULE_FAILED
                - IFC_WRITE_FAILED
                - INTERNAL
                - BUSY
                - TIMEOUT
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Health:
      type: object
      required: [status, version, limits, busy, uploads]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: Version of the core package (equal to the app version, ISO week-based JJJJ.W.N).
          examples: ['2026.9.0']
        limits:
          type: object
          required: [maxBodyBytes, timeoutMs, uploadTimeoutMs, maxUploads]
          properties:
            maxBodyBytes:
              type: integer
            timeoutMs:
              type: integer
              description: Maximum calculation time.
            uploadTimeoutMs:
              type: integer
              description: Maximum time to receive the body.
            maxUploads:
              type: integer
              description: Bodies received at the same time; more get 503 `BUSY`.
        busy:
          type: boolean
          description: A calculation runs now; a new request gets 503 `BUSY`.
        uploads:
          type: integer
          description: Request bodies being received now.
    ScheduleSummary:
      type: object
      required: [formatVersion, project, counts, tasks, criticalPath, warnings]
      properties:
        formatVersion:
          type: integer
          const: 1
        project:
          type: object
          required: [id, name, schedulingProfile, start, finish, durationWorkdays]
          properties:
            id:
              type: string
            name:
              type: string
            schedulingProfile:
              type: string
              description: The scheduling profile, for example `ops`, `p6` or `msproject`.
            start:
              type: string
              description: ISO 8601 date (or date-time with hour planning).
            finish:
              type: string
              description: Calculated finish, ISO 8601.
            durationWorkdays:
              type: number
        counts:
          type: object
          required: [tasks, summaryTasks, milestones, relations, resources, assignments, criticalTasks]
          properties:
            tasks:
              type: integer
            summaryTasks:
              type: integer
            milestones:
              type: integer
            relations:
              type: integer
            resources:
              type: integer
            assignments:
              type: integer
            criticalTasks:
              type: integer
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'
        criticalPath:
          type: array
          description: Task ids on the critical path, in path order.
          items:
            type: string
        warnings:
          type: array
          items:
            type: object
            required: [code, ids]
            properties:
              code:
                type: string
                enum:
                  - CONSTRAINT_VIOLATED
                  - DEADLINE_MISSED
                  - OUT_OF_SEQUENCE
                  - CALENDAR_CAPPED
                  - RELATION_IGNORED
                  - HAMMOCK_WITHOUT_FINISH_DRIVER
                  - XER_ARCHIVE_DROPPED
                  - MINUTE_MODEL_CONVERTED
              ids:
                type: array
                items:
                  type: string
              detail:
                type: string
                description: Short fixed reason, only for codes that have one (`XER_ARCHIVE_DROPPED`).
              maxShiftWorkdays:
                type: number
                description: |
                  Only for `MINUTE_MODEL_CONVERTED`: the dates in the file were not calculated in minutes
                  (an IFC from an older version of the app), so opening recalculated them; `ids` are the
                  tasks with a different start or finish, and this is the largest shift in workdays (one
                  decimal).
        foreignContent:
          description: |
            Only present after an `application/octet-stream` request with a building model that the
            bytes route opens: what the document keeps besides the schedule and writes back unchanged.
            The summary then comes from that reading. Every other summary comes from the text route
            and has no `foreignContent`.
          $ref: '#/components/schemas/ForeignContent'
    ForeignContent:
      type: object
      required: [format, schema, objectCount]
      properties:
        format:
          type: string
          const: ifc
          description: The file format of the kept content (ISO-10303-21).
        schema:
          type: string
          description: The IFC schema from the file header, for example `IFC4X3_ADD2` or `IFC4`.
        objectCount:
          type: integer
          description: The number of entities that are not part of the schedule.
    TaskSummary:
      type: object
      required: [id, name, wbs, parentId, summary, milestone, start, finish, lateStart, lateFinish, totalFloat, critical]
      properties:
        id:
          type: string
        name:
          type: string
        wbs:
          type: string
        parentId:
          type: [string, 'null']
        summary:
          type: boolean
        milestone:
          type: boolean
        start:
          type: string
        finish:
          type: string
        lateStart:
          type: string
        lateFinish:
          type: string
        totalFloat:
          type: number
          description: Total float in workdays (fractional with hour planning).
        critical:
          type: boolean
