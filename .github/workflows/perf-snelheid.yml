name: Snelheid voor en na

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/perf-snelheid.yml'
      - 'scripts/measure-large-plans*'
      - 'docs/superpowers/evidence/resource-leveler-performance.mjs'
      - 'src/engine/scheduler/ResourceLeveler.ts'
      - 'tests/planning/check-leveler-differential.ts'
      - 'tests/planning/measure-leveler.ts'
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exacte basis-SHA voor de vergelijking
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: perf-snelheid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Zwaar en bewust opt-in: een bewijscommit zonder productwijziging herhaalt de meting niet.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '<!-- meet-snelheid -->')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TZ: Europe/Amsterdam
      BASE_REVISION: ${{ github.event.pull_request.base.sha || inputs.base_revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kernmeting met exacte voorstel- en CPM-pariteit en CPU-profiel
        run: |
          set -euo pipefail
          mkdir -p evidence
          lscpu > evidence/cpu.txt
          node --cpu-prof --cpu-prof-dir=evidence --cpu-prof-name=leveler.cpuprofile \
            docs/superpowers/evidence/resource-leveler-performance.mjs \
            --base "$BASE_REVISION" --sizes 1000,5000,10000 --warmups 2 --repeats 5 \
            --out evidence/leveler.json 2>&1 | tee evidence/leveler.log
      - name: Vergelijk alle voorstellen van de bestaande profielmatrix met de echte basisbron
        run: |
          set -euo pipefail
          source=src/engine/scheduler/ResourceLeveler.ts
          cp "$source" "$RUNNER_TEMP/ResourceLeveler-candidate.ts"
          trap 'cp "$RUNNER_TEMP/ResourceLeveler-candidate.ts" "$source"' EXIT
          git show "$BASE_REVISION:$source" > "$source"
          OPS_LEVELER_PARITY_OUT="$GITHUB_WORKSPACE/evidence/profielen-voor.json" \
            bash tests/planning/run.sh check-leveler-differential.ts > evidence/profielen-voor.log 2>&1
          cp "$RUNNER_TEMP/ResourceLeveler-candidate.ts" "$source"
          OPS_LEVELER_PARITY_OUT="$GITHUB_WORKSPACE/evidence/profielen-na.json" \
            bash tests/planning/run.sh check-leveler-differential.ts > evidence/profielen-na.log 2>&1
          cmp evidence/profielen-voor.json evidence/profielen-na.json
          sha256sum evidence/profielen-{voor,na}.json
          cat evidence/profielen-{voor,na}.log
          bash tests/planning/run.sh check-leveler-seam.ts check-leveler-splitmode.ts \
            check-leveler-splits.ts check-leveler-pool-ledger.ts check-leveler-candidate-axis.ts \
            check-leveler-forward.ts check-apply-leveling-scope.ts check-leveling-delay-units.ts \
            > evidence/nivelleerchecks.log 2>&1
          tail -12 evidence/nivelleerchecks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nivelleerkern-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '<!-- meet-snelheid -->')
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TZ: Europe/Amsterdam
      BASE_REVISION: ${{ github.event.pull_request.base.sha || inputs.base_revision }}
      HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_REVISION }}
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_REVISION }}
          path: baseline
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Dezelfde afhankelijkheden en browser voor beide revisies
        run: |
          set -euo pipefail
          npm ci --prefix candidate
          ln -s "$PWD/candidate/node_modules" baseline/node_modules
          cd candidate
          npx playwright install --with-deps --only-shell chromium
      - name: Herkomst vastleggen
        run: |
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/baseline-sha.txt
          git -C candidate rev-parse HEAD > evidence/candidate-sha.txt
          lscpu > evidence/cpu.txt
          node --version > evidence/node.txt
          git -C candidate diff --name-only "$BASE_REVISION" HEAD -- src/ > evidence/productwijzigingen.txt
          cmp baseline/package-lock.json candidate/package-lock.json
          # Beide productbronnen krijgen exact dezelfde actuele meetwaarnemers.
          cp candidate/scripts/measure-large-plans.mjs baseline/scripts/measure-large-plans.mjs
      - name: Bestaande grote-planningenroute, drie herhalingen per grootte
        run: |
          set -euo pipefail
          # Bevestiging na run 41451571010: omgekeerde volgorde om runnerdrift zichtbaar te maken.
          for revision in candidate baseline; do
            (cd "$revision" && npm run measure:large-plans -- \
              --sizes 1000,5000,10000 --repeats 3 --skip autosave,recovery --parity \
              --step-timeout-s 90 --out "$GITHUB_WORKSPACE/evidence/$revision.json") \
              2>&1 | tee "evidence/$revision.log"
          done
      - name: Eis dezelfde invoer, volledige rekenuitvoer en opgeslagen IFC
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base, head = [json.loads(Path(f'evidence/{name}.json').read_text()) for name in ('baseline', 'candidate')]
          for a, b in zip(base['results'], head['results'], strict=True):
              assert a['size'] == b['size']
              assert a['dataset']['contentSha256'] == b['dataset']['contentSha256']
              oracle = a['runs'][0]['parity']
              assert set(oracle) == {'open', 'f5', 'levelApply', 'savedIfc'}, oracle
              for run in a['runs'] + b['runs']:
                  assert not run['notes'] and not run['errors'], run
                  assert run['parity'] == oracle, (a['size'], run['rep'], run['parity'], oracle)
                  assert all(run['phases'][phase]['ok'] for phase in ('open', 'scroll', 'zoom', 'f5', 'levelCalculate', 'levelApply', 'save'))
              print(a['size'], 'taken: alle herhalingen hebben gelijke store-, CPM-, belasting- en IFC-hashes', oracle)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snelheid-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
