name: Snelheid voor en na

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/perf-snelheid.yml'
      - 'scripts/measure-large-plans*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-snelheid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/snelheid'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TZ: Europe/Amsterdam
      BASE_REVISION: ${{ github.event.pull_request.base.sha || '6386f95e6ca28b47c1ded7c085b74a1e15c2d87b' }}
      HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_REVISION }}
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_REVISION }}
          path: baseline
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Dezelfde afhankelijkheden en browser voor beide revisies
        run: |
          set -euo pipefail
          npm ci --prefix candidate
          ln -s "$PWD/candidate/node_modules" baseline/node_modules
          cd candidate
          npx playwright install --with-deps --only-shell chromium
      - name: Herkomst vastleggen
        run: |
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/baseline-sha.txt
          git -C candidate rev-parse HEAD > evidence/candidate-sha.txt
          lscpu > evidence/cpu.txt
          node --version > evidence/node.txt
          git -C candidate diff --name-only "$BASE_REVISION" HEAD -- src/ > evidence/productwijzigingen.txt
      - name: Bestaande grote-planningenroute, drie herhalingen per grootte
        run: |
          set -euo pipefail
          for revision in baseline candidate; do
            (cd "$revision" && npm run measure:large-plans -- \
              --sizes 1000,5000,10000 --repeats 3 --skip autosave,recovery \
              --step-timeout-s 90 --out "$GITHUB_WORKSPACE/evidence/$revision.json") \
              2>&1 | tee "evidence/$revision.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snelheid-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
