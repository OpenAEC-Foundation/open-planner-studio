name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Zonder dit erft elke job de repo-default van GITHUB_TOKEN, terwijl deze
# workflow op een PR de afhankelijkheden van vreemde code installeert — een
# postinstall-script zou dan met schrijfrechten draaien. Beide jobs hebben
# genoeg aan lezen. (Gemeld door CodeQL op PR #33; stond ook als ci.yml-#1 in
# de workflow-audit.)
permissions:
  contents: read

# Bevinding O3: zonder dit draaien alle pushes op één branch tegelijk door.
# Hier mág er wél geannuleerd worden — een afgebroken CI-run laat niets achter
# (in tegenstelling tot release.yml/snap.yml, die daarom `false` gebruiken).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Bevinding O6: zonder limiet loopt een hangende job door tot de 6-uursgrens
    # van GitHub. De Tauri-build duurt normaal ~15-25 min per OS.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Bevinding O7: de Rust-afhankelijkheden compileerden bij elke run op alle
      # drie de OS'en opnieuw. rust-cache bewaart alleen de *dependency*-crates —
      # de workspace-crate zelf wordt weggegooid en dus elke run vers gebouwd.
      # Bewust NIET in release.yml: daar weegt reproduceerbaarheid van het
      # gesigneerde artefact zwaarder dan wandkloktijd, en die jobs dragen de
      # signing-sleutel in hun env.
      - name: Cache Rust build (src-tauri)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 10
        shell: bash
        run: |
          # Bugs 184/191: ook bij een geslaagde update kunnen Azure-pakketdownloads te traag blijven.
          # Kies vóór update én installatie rechtstreeks het officiële HTTPS-archief.
          # De Jammy-runner gebruikt /etc/apt/sources.list met mirror+file: (Azure eerst).
          # Vervang alleen de bron-URI; behoud suites, componenten, sleutelopties en externe bronnen.
          # https://github.com/actions/runner-images/blob/ubuntu22/20261012.322/images/ubuntu/scripts/build/configure-apt-sources.sh
          # https://manpages.ubuntu.com/manpages/jammy/man5/sources.list.5.html
          if ! grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list; then
            echo "::error::Onverwachte APT-bronnen: de Jammy-mirrorlijst ontbreekt; geen veilige automatische bronwissel."
            exit 1
          fi
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list

          # apt.conf(5): één retry per bestand, 15 s verbindings-/datatime-out voor beide transports.
          # https://manpages.ubuntu.com/manpages/jammy/man5/apt.conf.5.html
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)

          # --error-on=any weigert ook gedeeltelijk mislukte updates met oude indexen.
          # timeout draait als root voor de hele procesgroep (TERM, na 10 s KILL; geen --foreground).
          # APT-budget: 2 + 5 min + tweemaal 10 s afsluitruimte = 7 min 20 s; staplimiet 10 min.
          # https://manpages.ubuntu.com/manpages/jammy/man8/apt-get.8.html
          # https://www.gnu.org/software/coreutils/manual/html_node/timeout-invocation.html
          if ! sudo timeout --verbose --kill-after=10s 2m apt-get "${apt_options[@]}" --error-on=any update; then
            echo "::error::APT-update via het officiële Ubuntu-archief mislukt of overschrijdt 2 min."
            exit 1
          fi

          # Eén installatiepoging: een timeout kan dpkg onderbreken; stop dan de job zonder herstel/retry.
          if ! sudo timeout --verbose --kill-after=10s 5m apt-get "${apt_options[@]}" install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
            echo "::error::APT-installatie mislukt of overschrijdt 5 min; frontendinstallatie en build worden niet gestart."
            exit 1
          fi

      # Bevinding O2: `npm install` mag de lockfile bijwerken, dus CI valideerde
      # hem nooit — een out-of-sync lock glipte groen door en klapte pas op de
      # productie-deploy (live.yml gebruikt al `npm ci`). Nu faalt CI hier.
      - name: Install frontend dependencies (npm ci)
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --no-bundle

  # De `verify`-poort in parallelle delen. `scripts/verify-parts.mjs` leest de stappen RECHTSTREEKS
  # uit `npm run verify` in package.json en deelt ze alleen in; een stap die daar niet is ingedeeld
  # valt vanzelf in `static`, en het `static`-deel controleert dat deze matrix elk deel draait. Zo
  # blijft package.json de ene definitie (de reden dat hier eerst bewust één commando stond), terwijl
  # de wandkloktijd de langste job wordt in plaats van de som. live.yml draait zelf geen verify: die
  # deployt pas als deze workflow op main geslaagd is. release.yml draait `npm run verify` nog in één
  # keer (zie de timeout daar).
  verify:
    name: verify (${{ matrix.name }})
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: static
            name: static
          - part: planning
            name: planning
          - part: suites
            name: suites
          # De browsersuite is de langste stap (~31 min testtijd in één job). Vier runners, elk met een
          # eigen bewaakte Vite-server. De verdeling is op gemeten duur per spec
          # (`--duration-shard`, scripts/browser-shards.mjs + tests/browser/spec-durations.json), niet
          # Playwrights `--shard`: die knipt op aantal tests in bestandsvolgorde, waardoor alle lange
          # tutorialspecs in shard 4 vielen (436/402/454/566 s in run 39275828606). De shards samen
          # dekken altijd alle specs (tests/dev-server/browser-shards.test.mjs).
          - part: browser
            name: browser 1-4
            shard: 1/4
          - part: browser
            name: browser 2-4
            shard: 2/4
          - part: browser
            name: browser 3-4
            shard: 3/4
          - part: browser
            name: browser 4-4
            shard: 4/4

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.part == 'browser'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check that this matrix runs every verify part
        if: matrix.part == 'static'
        run: node scripts/verify-parts.mjs --check-ci .github/workflows/ci.yml

      - name: Verify (${{ matrix.name }})
        run: node scripts/verify-parts.mjs ${{ matrix.part }} ${{ matrix.shard && format('-- --duration-shard={0}', matrix.shard) || '' }}

      - name: Upload Playwright failure artifacts
        if: failure() && matrix.part == 'browser'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ci-${{ matrix.part }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Houdt de bestaande checknaam `test` (waar een verplichte-check-instelling op kan staan) en is
  # alleen groen als élk verify-deel groen is — ook bij een overgeslagen of afgebroken deel rood.
  test:
    if: always()
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: All verify parts green
        run: |
          echo "verify: ${{ needs.verify.result }}"
          test "${{ needs.verify.result }}" = "success"
