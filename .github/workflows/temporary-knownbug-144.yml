name: Temporary knownbug 144 diagnosis
on: [pull_request]
permissions: { contents: read }
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash tests/planning/run.sh check-knownbug-144-diagnostic.ts
