name: Deploy site

# Deployt pas ná een geslaagde CI-run op `main`. Dit workflow draait zelf GEEN verify meer:
# de uitkomst van `ci.yml` op die push (de verify-delen zonder browsersuite, plus de Tauri-builds) is
# de poort. De geplande en handmatige browserruns van CI deployen niet: zie `concurrency` en de `if`
# hieronder. Eerder draaide
# hier een eigen, seriële `npm run verify`; dat duurde 31–45 min en haalde de grens van 45 min op
# 2026-10-13 niet meer (run 38422479396: alle stappen groen, afgebroken 3 s voor het einde, deploy
# overgeslagen), terwijl ci.yml dezelfde controles al parallel had gedraaid.
#
# Bewust geen `workflow_dispatch`: zonder poort zou een handmatige run elke branch ongecontroleerd
# naar productie zetten. Opnieuw deployen: "Re-run all jobs" op de run van dit workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Bewust `false`: dit is een echte productie-deploy die met `rsync` bestanden
  # overzet. Twee snelle pushes achter elkaar braken met `true` de eerste run
  # middenin de overdracht af — resultaat: een half gedeployde site. Deploys
  # horen op elkaar te wachten, niet elkaar te annuleren.
  # GitHub houdt per groep één wachtende run vast; een nieuwere run vervangt die. Alleen een run die
  # echt deployt hoort daarom in `deploy-site`. Elke andere run (rode of geannuleerde CI, een oude commit,
  # een geplande of handmatige browserrun) krijgt een eigen groep per run: in `deploy-site` zou hij een
  # wachtende deploy verdringen en daarna zelf overslaan, en die commit ging dan niet live.
  # Deze groep en de `if` op de job `deploy` eisen dezelfde drie voorwaarden: verander ze samen.
  group: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.sha == github.event.workflow_run.head_sha) && 'deploy-site' || format('deploy-site-overslaan-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    # De poort, gelijk aan de voorwaarde in `concurrency.group`: verander ze samen. Alle voorwaarden samen:
    #  - CI is geslaagd (een geannuleerde of rode run deployt niet);
    #  - de CI-run kwam uit een push op main, niet uit een pull request;
    #  - `github.sha` (bij `workflow_run` de punt van de standaardbranch op het moment dat deze run
    #    start, en wat de gepinde deploy-workflow hieronder uitcheckt) is precies de commit die CI
    #    testte. Is `main` intussen verder, dan slaat deze run over: de nieuwere push heeft zijn
    #    eigen CI-run en daarna zijn eigen deploy. Zo bouwt de deploy nooit ongeteste code.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.sha == github.event.workflow_run.head_sha
    # Op SHA gepind in plaats van `@main`. Deze reusable workflow krijgt
    # `DEPLOY_SSH_KEY` doorgegeven: op `@main` kon iedereen met schrijfrechten op
    # OpenAEC-Foundation/github bij de volgende main-push van DEZE repo de
    # deploysleutel exfiltreren, zonder dat hier iets wijzigde. De repo heeft
    # geen tags, dus een SHA is de enige onveranderlijke ref.
    # Bijwerken = deze SHA bewust verhogen (upstream-wijzigingen komen niet meer
    # vanzelf binnen); 33fa7d9 = "Update deployment actions to Node.js 24".
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@33fa7d9469a6632154d97210acbb637278738a04
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/open-planner-studio.open-aec.com
      node_version: "22"
      install_command: npm ci
      build_command: npm run build && node scripts/web-statistics.mjs
      deploy_source: dist
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
