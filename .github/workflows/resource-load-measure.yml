# Tijdelijke, afgebakende vergelijking voor het taakwerkdagen-hergebruik.
# Deze tekst is geplaatst door een AI-assistent.
name: Resourcebelasting voor-na

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/resource-load-measure.yml'
      - 'tests/planning/check-resource-load-reuse.ts'
      - 'tests/planning/resourceLoadReuseFixture.ts'
      - 'tests/planning/measure-resource-load-reuse.mjs'

permissions:
  contents: read

concurrency:
  group: resource-load-measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.head_ref == 't3/resource-load-performance-1'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RESOURCE_LOAD_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Afhankelijkheden
        run: npm ci
      - name: Controleer de vertalingsmerge
        run: |
          npm run i18n:resolve
          git diff --exit-code HEAD -- src/i18n i18n
      - name: Gerichte regressies en schaalpoort
        run: bash tests/planning/run.sh check-resource-load-reuse.ts check-resource-load-splits.ts check-resource-load-reasons.ts check-contour-engine.ts check-short-hour-task-load.ts check-leveler-pool-ledger.ts
      - name: Meet basis en wijziging op dezelfde runner
        run: |
          git fetch --no-tags origin "$RESOURCE_LOAD_BASE"
          before_dir=$(mktemp -d)
          trap 'rm -rf "$before_dir"' EXIT
          git archive "$RESOURCE_LOAD_BASE" | tar -x -C "$before_dir"
          mkdir -p build/resource-load-measure
          NODE_PATH="$PWD/node_modules" node_modules/.bin/esbuild tests/planning/check-resource-load-reuse.ts --bundle --platform=node --format=esm --alias:@="$before_dir/src" --outfile="$RUNNER_TEMP/resource-load-before-check.mjs"
          node "$RUNNER_TEMP/resource-load-before-check.mjs" > build/resource-load-measure/before-check.log 2>&1
          cat build/resource-load-measure/before-check.log
          node --expose-gc tests/planning/measure-resource-load-reuse.mjs "$before_dir" "$RESOURCE_LOAD_BASE" build/resource-load-measure
      - name: Bewaar meetbewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-load-voor-na-${{ github.sha }}
          path: |
            build/resource-load-measure/result.json
            build/resource-load-measure/summary.md
            build/resource-load-measure/before-check.log
          if-no-files-found: ignore
          retention-days: 14
