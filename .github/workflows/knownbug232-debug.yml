name: Knownbug 232 diagnostiek tijdelijk
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/knownbug232-debug.yml']
jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Test met oplossing
        shell: bash
        run: |
          bash tests/planning/run.sh check-progress-actual-start-floor.ts > /tmp/fix.log 2>&1 || true
          grep -E 'XX |ROOD|GROEN|EINDOORDEEL|Error' /tmp/fix.log | tail -40 || true
      - name: Test zonder oplossing
        shell: bash
        run: |
          git show 45fd1982d03df8fe2c9d60a6901dcbacb13b0f05:src/engine/scheduler/CPMSolver.ts > src/engine/scheduler/CPMSolver.ts
          bash tests/planning/run.sh check-progress-actual-start-floor.ts > /tmp/base.log 2>&1 || true
          grep -E 'XX |ROOD|GROEN|EINDOORDEEL|Error' /tmp/base.log | tail -40 || true
