name: APT DNS probe (temporary)

on:
  push:
    branches: [fix/ci-apt-dns-terugval]

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Resolve all candidate archives on the same runner
        shell: bash
        run: |
          date -u
          for host in archive.ubuntu.com azure.archive.ubuntu.com security.ubuntu.com mirrors.edge.kernel.org; do
            echo "=== DNS: $host ==="
            if timeout --kill-after=2s 20s getent ahosts "$host"; then
              echo "DNS_RESULT $host exit=0"
              echo "DNS_RESULT $host exit=0" >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              echo "DNS_RESULT $host exit=$status"
              echo "DNS_RESULT $host exit=$status" >> "$GITHUB_STEP_SUMMARY"
            fi
            case "$host" in
              security.ubuntu.com) path=ubuntu/dists/jammy-security/Release ;;
              mirrors.edge.kernel.org) path=ubuntu/dists/jammy/Release ;;
              *) path=ubuntu/dists/jammy/Release ;;
            esac
            if curl --head --fail --connect-timeout 5 --max-time 15 "https://$host/$path"; then
              echo "HTTPS_RESULT $host exit=0"
            else
              echo "HTTPS_RESULT $host exit=$?"
            fi
          done
